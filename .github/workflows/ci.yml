name: CI — Tests & Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docuquery:ci .

      # OpenShift starts containers with a random UID in group 0.
      # Running the same way here proves the image doesn't need root.
      - name: Start container as a random non-root user
        run: docker run -d --name docuquery -p 8000:8000 --user 1000870000:0 docuquery:ci

      - name: Wait for the health check
        run: |
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8000/healthz; then echo; echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs docuquery
          exit 1

      - name: Container logs
        if: always()
        run: docker logs docuquery || true

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest documents
        run: python -m src.ingest --source data/

      - name: Run evaluation (CI gate)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.evaluate --ci

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evals/results.json
