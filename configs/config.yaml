# ═══════════════════════════════════════════════════════
# DocuQuery — Configuration
# ═══════════════════════════════════════════════════════

chunking:
  chunk_size: 600
  chunk_overlap: 100
  min_chunk_size: 50

embedding:
  model: "all-MiniLM-L6-v2"

vector_store:
  collection_name: "docuquery"
  persist_directory: "./chroma_db"

retrieval:
  top_k: 5

  # Hybrid search weights (must sum to 1.0)
  bm25_weight: 0.3
  vector_weight: 0.7

  # Cross-encoder re-ranker
  reranker:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: 3

generation:
  # LLM provider: "groq" (Llama 3.3 70B, free tier — needs GROQ_API_KEY)
  #            or "anthropic" (Claude — needs ANTHROPIC_API_KEY)
  #            or "vllm" (any OpenAI-compatible endpoint, e.g. a model served with
  #               vLLM on OpenShift AI — needs DOCUQUERY_LLM_BASE_URL).
  # Override at runtime with DOCUQUERY_LLM_PROVIDER / DOCUQUERY_LLM_MODEL.
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  temperature: 0.1
  max_tokens: 1024
  system_prompt: |
    You are a precise research assistant that answers questions based ONLY on
    the provided context chunks. You must follow these rules strictly:

    1. Ground every factual claim by citing the relevant chunk ID in square
       brackets at the end of the sentence, e.g. [abc12345].
    2. You may cite multiple chunks for a single claim if needed.
    3. If the provided context does not contain sufficient information to
       answer the question fully, respond with:
       "I don't have enough information in the provided documents to answer this question."
    4. Never fabricate, infer, or extrapolate beyond what the context states.
    5. Keep answers clear, concise, and well-structured.
    6. If only part of the question can be answered from context, answer that
       part and explicitly state what cannot be answered.

evaluation:
  golden_qa_path: "evals/golden_qa.json"
  results_path: "evals/results.json"
  # Quality gates — CI fails the PR if any is breached
  citation_coverage_threshold: 0.90     # rule-based: cited sentences / sentences
  faithfulness_threshold: 0.85          # LLM judge: claims supported by retrieved chunks
  answer_correctness_threshold: 0.75    # LLM judge: agreement with golden answer
  latency_p95_ms_threshold: 8000        # end-to-end pipeline P95
  max_error_rate: 0.0

observability:
  log_dir: "./logs"
  log_requests: true
  log_level: "INFO"
  max_traces_in_memory: 1000
  # Per-request quality SLOs: breaches are logged as "QUALITY ALERT" and
  # counted in the Prometheus metric docuquery_quality_alerts_total{reason}
  alerts:
    min_citation_coverage: 0.90
    max_latency_ms: 8000

ingest:
  # /api/ingest only accepts paths inside this directory
  allowed_root: "data"

app:
  host: "0.0.0.0"
  port: 8000
  title: "DocuQuery"
